name: SuperTest API Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SuperTest
        run: npm test

      - name: Prepare HTML report
        if: always()
        run: |
          test -f ./Specs/Report/report.html
          cp ./Specs/Report/report.html ./Specs/Report/index.html
          echo "Report prepared successfully"

      - name: Archive SuperTest test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SuperTest-test-report
          path: ./Specs/Report
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Specs/Report

  deploy:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy HTML Report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Report URL
        run: |
          echo "## 🧪 SuperTest HTML Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 👉 [Open HTML Test Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
